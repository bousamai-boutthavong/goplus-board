<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>ERWIN</title>
<style>
  :root{
    --bg:#04050a; --ink:#eaf1f4; --hue:207;
    --accent:hsl(207 85% 62%); --line:hsla(207,60%,60%,.20); --panel:rgba(10,14,20,.55);
    --mono:'SF Mono',ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;user-select:none}
  #orb{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}

  .wordmark{position:fixed;top:28px;left:50%;transform:translateX(-50%);z-index:3;
       display:flex;align-items:center;gap:10px;font-family:var(--mono);letter-spacing:.42em;font-size:15px;font-weight:600}
  .wordmark .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);
       box-shadow:0 0 14px var(--accent);animation:blink 2.6s infinite;transition:background .6s,box-shadow .6s}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

  .bar{position:fixed;left:50%;transform:translateX(-50%);bottom:30px;z-index:4;display:flex;align-items:center;gap:9px}
  .field{width:min(300px,44vw);display:flex;align-items:center;background:var(--panel);border:1px solid var(--line);
         border-radius:16px;padding:11px 15px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:border-color .5s}
  .field input{flex:1;background:none;border:0;outline:0;color:var(--ink);font-family:var(--sans);font-size:15px}
  .btn{width:46px;height:46px;flex:0 0 auto;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);
       display:grid;place-items:center;cursor:pointer;transition:.18s,border-color .5s;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn:active{transform:scale(.93)}
  .btn svg{width:20px;height:20px}
  .btn.mic.on{background:var(--accent);color:#04140c;border-color:var(--accent);box-shadow:0 0 20px var(--accent)}
  .btn.rec.on{background:#ff5568;color:#fff;border-color:#ff5568;animation:pulseRec 1.1s infinite}
  @keyframes pulseRec{0%,100%{box-shadow:0 0 16px rgba(255,85,104,.5)}50%{box-shadow:0 0 26px rgba(255,85,104,.85)}}

  /* live vision */
  .cam{position:fixed;inset:0;background:rgba(2,4,7,.92);z-index:20;display:grid;place-items:center;align-content:center;gap:18px;
       backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .cam[hidden]{display:none}
  .cam-frame{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--accent);
       box-shadow:0 0 70px hsla(var(--hue),75%,50%,.3);line-height:0}
  .cam-frame video{max-width:82vw;max-height:60vh;transform:scaleX(-1);display:block;background:#000}
  .cam-frame .scan{position:absolute;left:0;right:0;height:2px;top:0;
       background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.7;animation:scan 3.2s linear infinite}
  @keyframes scan{0%{top:0}100%{top:100%}}
  .vbrk{position:absolute;width:26px;height:26px;border:2px solid var(--accent);opacity:.9}
  .vbrk.tl{top:12px;left:12px;border-right:0;border-bottom:0}.vbrk.tr{top:12px;right:12px;border-left:0;border-bottom:0}
  .vbrk.bl{bottom:12px;left:12px;border-right:0;border-top:0}.vbrk.br{bottom:12px;right:12px;border-left:0;border-top:0}
  .live{position:absolute;top:14px;left:14px;width:9px;height:9px;border-radius:50%;background:#ff5568;box-shadow:0 0 12px #ff5568;animation:blink 1.3s infinite}
  .cam-ctrl{display:flex;gap:14px}
  .cam-note{font-size:12.5px;color:hsla(168,10%,62%,1);font-family:var(--sans);max-width:80vw;text-align:center;min-height:16px}

  /* === v4 hologram stage — ภาพ mascot จริง + เลเยอร์เอฟเฟกต์ (2026-07-02) === */
  body{background:radial-gradient(120% 95% at 50% 38%, #0d3166 0%, #071c42 45%, #020814 100%)}
  .stage{position:fixed;left:50%;top:43%;transform:translate(-50%,-50%);
    width:min(88vmin,600px);aspect-ratio:1;z-index:1;cursor:pointer}
  .float{position:absolute;inset:0;animation:float 3.8s ease-in-out infinite;will-change:transform;
    -webkit-mask-image:radial-gradient(closest-side,#000 62%,rgba(0,0,0,.7) 82%,transparent 100%);
    mask-image:radial-gradient(closest-side,#000 62%,rgba(0,0,0,.7) 82%,transparent 100%)}
  @keyframes float{0%,100%{transform:translateY(1.2%)}50%{transform:translateY(-2.4%)}}
  .glowb{position:absolute;left:50%;top:44%;width:80%;aspect-ratio:1;transform:translate(-50%,-50%);
    background:radial-gradient(closest-side,hsla(var(--hue),90%,62%,.35),hsla(var(--hue),90%,52%,.10) 55%,transparent 78%);
    filter:blur(8px);opacity:calc(.45 + var(--e,.12)*.8);animation:breathe 3.8s ease-in-out infinite;pointer-events:none}
  @keyframes breathe{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.07)}}
  .tint{position:absolute;inset:0;filter:hue-rotate(var(--rot,0deg));transition:filter 1s}
  
  #mcv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  
  .scanband{position:absolute;left:5%;right:5%;height:11%;top:-12%;mix-blend-mode:screen;pointer-events:none;
    background:linear-gradient(180deg,transparent,rgba(150,215,255,.08),transparent);animation:sweep 5.4s linear infinite}
  @keyframes sweep{0%{top:-12%}100%{top:104%}}
  .scantex{position:absolute;inset:0;mix-blend-mode:screen;pointer-events:none;opacity:.45;
    background:repeating-linear-gradient(0deg,rgba(150,210,255,.05) 0 1px,transparent 1px 4px)}
  .ring{position:absolute;left:50%;aspect-ratio:1;border-radius:50%;pointer-events:none}
  .ring{display:none}
  .ring.r1{width:66%;bottom:2%;border:1px solid hsla(var(--hue),85%,70%,.45);
    transform:translateX(-50%) rotateX(76deg);animation:spin1 18s linear infinite}
  .ring.r2{width:47%;bottom:6.5%;border:1px dashed hsla(var(--hue),85%,75%,.38);
    transform:translateX(-50%) rotateX(76deg);animation:spin2 30s linear infinite}
  @keyframes spin1{from{transform:translateX(-50%) rotateX(76deg) rotate(0)}to{transform:translateX(-50%) rotateX(76deg) rotate(360deg)}}
  @keyframes spin2{from{transform:translateX(-50%) rotateX(76deg) rotate(360deg)}to{transform:translateX(-50%) rotateX(76deg) rotate(0)}}
  body[data-state="listening"]{--rot:-16deg} body[data-state="thinking"]{--rot:62deg}
  body[data-state="speaking"]{--rot:-44deg} body[data-state="recording"]{--rot:148deg}
  body[data-state="vision"]{--rot:10deg}
  body.sleeping .tint{filter:hue-rotate(var(--rot,0deg)) brightness(.48) saturate(.6)}
  body.sleeping .float{animation-duration:8.5s}
  body.sleeping .glowb{opacity:.15}
  body.sleeping .scanband{opacity:.3}
  .stage.poked .float{animation:pokejump .75s cubic-bezier(.34,1.56,.44,1) 1}
  @keyframes pokejump{0%{transform:translateY(0) scale(1)}30%{transform:translateY(-3.5%) scale(1.05,.95)}
    60%{transform:translateY(1%) scale(.97,1.04)}100%{transform:translateY(0) scale(1)}}
</style>
</head>
<body>
<canvas id="orb"></canvas>
<div class="stage" id="stage">
  <div class="glowb"></div>
  <div class="float">
    <div class="tint">
      
    </div>
    <div class="scanband"></div>
    <div class="scantex"></div>
  </div>
  <div class="ring r1"></div><div class="ring r2"></div>
</div>


<div class="wordmark"><span class="dot"></span>ERWIN</div>

<div class="bar">
  <div class="field"><input id="field" type="text" placeholder="" autocomplete="off"></div>
  <button class="btn" id="camBtn" title="เปิด Vision (กล้องสด)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h2l1.5-2h7L19 6a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.4"/></svg>
  </button>
  <button class="btn rec" id="recBtn" title="อัดเสียง">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="3.4" fill="currentColor" stroke="none"/></svg>
  </button>
  <button class="btn mic" id="mic" title="พูดกับ Erwin">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>
  </button>
  <button class="btn" id="send" title="ส่ง">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l16-8-6 16-3-7-7-1z"/></svg>
  </button>
</div>

<div class="cam" id="cam" hidden>
  <div class="cam-frame">
    <video id="camVid" autoplay playsinline muted></video>
    <div class="scan"></div>
    <div class="vbrk tl"></div><div class="vbrk tr"></div><div class="vbrk bl"></div><div class="vbrk br"></div>
    <div class="live"></div>
  </div>
  <div class="cam-ctrl">
    <button class="btn" id="camShot" title="ให้ Erwin ดูตอนนี้">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
    <button class="btn" id="camClose" title="ปิด Vision">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="cam-note" id="camNote"></div>
</div>

<script>
/* ==========================================================
   ERWIN — minimal voice+vision assistant
   เห็น(กล้อง) · ฟัง(ไมค์) · คิด(Claude จริงผ่าน local proxy /ask) · พูดตอบ(TTS)
   ถ้าไม่มี proxy → ใช้สมองเดโม (offline) · ตอบเป็นเสียงไทยเสมอ
   ========================================================== */

/* ---- โทนสีตามสถานะ ---- */
const STATES={ standby:{hue:207,e:0.12}, listening:{hue:186,e:0.5}, thinking:{hue:275,e:0.62},
  speaking:{hue:158,e:0.7}, recording:{hue:356,e:0.55}, vision:{hue:222,e:0.55} };
let baseHue=207,targetHue=207,curHue=207,curState='standby';
const lerpHue=(a,b,t)=>{let d=((b-a+540)%360)-180;return (a+d*t+360)%360;};

/* ==========================================================
   v4 — mascot จริงเป็นเลเยอร์กลาง (ตามบรีฟ Bou 2026-07-02)
   canvas = สภาพแวดล้อมเท่านั้น: อนุภาคลอย + โครงข่ายจุดไกลๆ
   อารมณ์/สถานะ = CSS layer (hue-rotate · glow · float · scan)
   ========================================================== */
const cv=document.getElementById('orb'),ctx=cv.getContext('2d');
let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);
  const vw=innerWidth||document.documentElement.clientWidth||360;
  const vh=innerHeight||document.documentElement.clientHeight||640;
  W=cv.width=vw*DPR;H=cv.height=vh*DPR;cv.style.width=vw+'px';cv.style.height=vh+'px';}
addEventListener('resize',resize);resize();

/* ==========================================================
   v9 — Cosmic Core (2026-07-02)
   ตามสั่ง Bou: ไม่เอาหุ่น/แขน/หัว/ตา/สปอตไลท์ — เหลือ "แก่นหัวใจ"
   กระสุนวงจักรขยายใหญ่กลางจอ รายล้อมด้วยเม็ดอนุภาคน้อยใหญ่นับพัน
   โคจรหลายระนาบแบบกาแล็กซี · ปฏิกิริยาครบ: เสียง/นิ้ว/กล้อง/จิ้ม/หลับ
   ========================================================== */
const mhash=i=>{const s=Math.sin(i*127.1+311.7)*43758.5453; return s-Math.floor(s);};
const tintEl=document.querySelector('.tint');
const mcv=document.createElement('canvas'); mcv.id='mcv'; tintEl.appendChild(mcv);
const mctx=mcv.getContext('2d');
let MW=0,MH=0,MDPR=1;
function sizeMascot(){const r=document.getElementById('stage').getBoundingClientRect();
  const vmin=Math.min(innerWidth||360,innerHeight||640);
  MDPR=Math.min(DPR, vmin<520?1.6:2);
  MW=mcv.width=Math.max(2,r.width*MDPR); MH=mcv.height=Math.max(2,r.height*MDPR);
  mcv.style.width=r.width+'px'; mcv.style.height=r.height+'px';}
addEventListener('resize',sizeMascot); sizeMascot();

const SPR=[[120,195,255],[60,145,250],[228,246,255]].map(([r,g,b])=>{
  const c=document.createElement('canvas');c.width=c.height=32;
  const g2=c.getContext('2d'),gr=g2.createRadialGradient(16,16,0,16,16,16);
  gr.addColorStop(0,'rgba(255,255,255,1)');
  gr.addColorStop(0.2,`rgba(${r},${g},${b},0.95)`);
  gr.addColorStop(0.5,`rgba(${r},${g},${b},0.25)`);
  gr.addColorStop(1,'rgba(0,0,0,0)');
  g2.fillStyle=gr;g2.fillRect(0,0,32,32);return c;});

/* ---------- แก่นหัวใจ (วงจักรใหญ่) ---------- */
const CORE={cx:0.5,cy:0.475,r:0.16};
const THREADS=[];
for(let i=0;i<30;i++)THREADS.push({
  tilt:mhash(i*3+40)*3.1416, sq:0.20+mhash(i*5+41)*0.75,
  sp:(0.45+mhash(i*7+42)*1.35)*(mhash(i*11+43)>0.5?1:-1),
  rr:0.55+mhash(i*13+44)*0.50, span:1.5+mhash(i*17+45)*2.8,
  ph:mhash(i*19+46)*6.283});

/* ---------- ฝูงอนุภาคnับพัน โคจรรอบแก่น ---------- */
const vmin0=Math.min(innerWidth||360,innerHeight||640);
const N=vmin0<520?1900:2700;
const P=[];
for(let i=0;i<N;i++){
  const disc=mhash(i*3+1)<0.42;                       // 42% = จานวงแหวนเอียง · ที่เหลือ = ทรงกลมฟุ้ง
  const incl=disc?(1.22+(mhash(i*5+2)-0.5)*0.3):(mhash(i*5+2)*3.1416);
  const orad=CORE.r*(0.6+Math.pow(mhash(i*7+3),1.55)*3.1);
  P.push({
    ang:mhash(i*11+4)*6.2832, incl, orad,
    w:(0.0018+0.0012/Math.max(0.12,orad))*(mhash(i*13+5)>0.5?1:-1),
    big:mhash(i*17+6)<0.055,                          // เม็ดใหญ่ bokeh ~5%
    lum:0.25+mhash(i*19+7)*0.75,
    ph:mhash(i*23+8)*6.283,
    delay:mhash(i*29+9)*1.2,
    px:0.5+(mhash(i*31+10)-0.5)*1.6, py:0.5+(mhash(i*37+11)-0.5)*1.6,
    vx:0,vy:0,hx:0.5,hy:0.5,zd:0});
}

/* ---------- ปฏิสัมพันธ์ ---------- */
let ptrX=-9,ptrY=-9;
addEventListener('pointermove',ev=>{
  const r=mcv.getBoundingClientRect(); if(!r.width)return;
  ptrX=(ev.clientX-r.left)/r.width; ptrY=(ev.clientY-r.top)/r.height;
},{passive:true});
const clearPtr=()=>{ptrX=ptrY=-9};
addEventListener('pointerleave',clearPtr); addEventListener('pointerup',clearPtr);
addEventListener('pointercancel',clearPtr); addEventListener('touchend',clearPtr,{passive:true});
let burst=0;
const oldPoke=poke;
poke=function(){ oldPoke(); burst=1; };

/* ---------- เสียง + กล้อง ---------- */
let voice=0,vAnalyser=null,vData=null,vActx=null;
function hookAudioAnalyser(audioEl){
  try{
    vActx=vActx||new (window.AudioContext||window.webkitAudioContext)();
    const src=vActx.createMediaElementSource(audioEl);
    vAnalyser=vActx.createAnalyser(); vAnalyser.fftSize=64;
    vData=new Uint8Array(vAnalyser.frequencyBinCount);
    src.connect(vAnalyser); vAnalyser.connect(vActx.destination);
  }catch(e){ vAnalyser=null; }
}
function voiceKick(v){ voice=Math.min(1.6,voice+v); }
let excite=0,exciteT=0,prevFrame=null;
const motCv=document.createElement('canvas'); motCv.width=32; motCv.height=24;
const motCtx=motCv.getContext('2d',{willReadFrequently:true});
setInterval(()=>{
  try{
    const v=document.getElementById('camVid');
    if(!v||!v.videoWidth||document.getElementById('cam').hidden){exciteT=0;prevFrame=null;return;}
    motCtx.drawImage(v,0,0,32,24);
    const d=motCtx.getImageData(0,0,32,24).data;
    if(prevFrame){let s=0;
      for(let i=0;i<d.length;i+=16)s+=Math.abs(d[i]-prevFrame[i]);
      exciteT=Math.min(1,(s/(d.length/16))/26);}
    prevFrame=d.slice();
  }catch(e){}
},160);

let bornT=-1;
function renderMascot(e,hue){
  if(!MW)return;
  if(bornT<0)bornT=t;
  if(vAnalyser&&isSpeaking){ vAnalyser.getByteFrequencyData(vData);
    let s=0; for(let i=1;i<vData.length;i++)s+=vData[i];
    voice=Math.max(voice,(s/vData.length/255)*2.0);}
  voice*=0.90; burst*=0.90;
  excite+=(exciteT-excite)*0.06;
  const V=(curState==='speaking'?voice:voice*0.4)+excite*0.8;
  const asleep=sleeping?0.35:1;
  const age=t-bornT;
  const sway=Math.sin(t*0.42)*0.026+Math.sin(t*0.17)*0.013;
  const swayY=Math.cos(t*0.31)*0.014;
  const breath=1+Math.sin(t*1.05)*0.015+V*0.015;
  const driftX=Math.sin(t*0.37)*0.014+Math.sin(t*0.13)*0.009;
  const driftY=Math.cos(t*0.29)*0.012+Math.sin(t*0.51)*0.006+(1-asleep)*0.04;
  const spin=(1+V*2.4+excite*1.6+e*0.5)*(sleeping?0.3:1);
  mctx.clearRect(0,0,MW,MH);
  mctx.globalCompositeOperation='lighter';

  /* ฮาโลรอบแก่น (แทนสปอตไลท์เดิม — กลมกลืน ไม่มีลำแสง) */
  const oc={x:(0.5+(CORE.cx-0.5)*breath+driftX)*MW, y:(0.47+(CORE.cy-0.47)*breath+driftY)*MH};
  const orbR=CORE.r*MW*breath*(1+V*0.16+burst*0.25);
  const halo=mctx.createRadialGradient(oc.x,oc.y,0,oc.x,oc.y,orbR*3.1);
  halo.addColorStop(0,`hsla(${hue},85%,60%,${(0.16+V*0.10)*asleep})`);
  halo.addColorStop(0.45,`hsla(${hue},85%,55%,${0.06*asleep})`);
  halo.addColorStop(1,'hsla(0,0%,0%,0)');
  mctx.fillStyle=halo; mctx.beginPath(); mctx.arc(oc.x,oc.y,orbR*3.1,0,7); mctx.fill();

  /* ฝูงอนุภาคโคจร */
  const waveR=((t*(0.24+V*0.3))%1.6);
  for(const q of P){
    q.ang+=q.w*spin*(1+q.big*0.2);
    const ca=Math.cos(q.ang), sa=Math.sin(q.ang), ci=Math.cos(q.incl), si=Math.sin(q.incl);
    q.hx=CORE.cx+ca*q.orad;
    q.hy=CORE.cy+sa*q.orad*ci*0.88;
    q.zd=sa*si;                                        // ลึก/ตื้น จากระนาบวงโคจร
    let ax=(q.hx-q.px)*0.07, ay=(q.hy-q.py)*0.07;
    const dxp=q.px-ptrX,dyp=q.py-ptrY,dp2=dxp*dxp+dyp*dyp;
    if(dp2<0.015){const f=(0.015-dp2)*1.25/Math.max(0.05,Math.sqrt(dp2)); ax+=dxp*f; ay+=dyp*f;}
    if(burst>0.02){const dxb=q.px-CORE.cx,dyb=q.py-CORE.cy,db=Math.max(0.06,Math.hypot(dxb,dyb));
      ax+=dxb/db*burst*0.06; ay+=dyb/db*burst*0.06;}
    if(V>0.05){const dxm=q.px-CORE.cx,dym=q.py-CORE.cy,dm=Math.max(0.05,Math.hypot(dxm,dym));
      const f=V*0.010*Math.exp(-dm*3.2)*Math.sin(t*20+dm*26);
      ax+=dxm/dm*f; ay+=dym/dm*f;}
    q.vx=(q.vx+ax)*0.86; q.vy=(q.vy+ay)*0.86;
    q.px+=q.vx; q.py+=q.vy;
    const rx=(0.5+(q.px-0.5)*breath+sway*q.zd*0.6+driftX)*MW;
    const ry=(0.47+(q.py-0.47)*breath+swayY*q.zd*0.6+driftY)*MH;
    const wave=Math.exp(-Math.pow((q.orad/CORE.r*0.32-waveR+0.32)*7,2));
    const tw=0.45+0.55*Math.sin(t*2.3+q.ph);
    const fade=Math.min(1,Math.max(0,(age-q.delay)/0.9));
    const depth=1+q.zd*0.32;
    const near=Math.pow(Math.max(0,1-(q.orad/(CORE.r*3.7))),0.7);   // ใกล้แก่น = สว่าง
    const al=Math.min(1,(0.14+q.lum*0.30+near*0.34)*depth*tw*(0.95+e*0.4+V*0.4))*asleep*fade+wave*0.4*fade;
    const sz=(q.big?(4.6+q.lum*4.2):(0.9+q.lum*2.5+near*1.2))*depth*(1+wave*0.55+V*0.3)*MDPR;
    mctx.globalAlpha=Math.min(1,al);
    mctx.drawImage(SPR[q.lum>0.82?2:(q.lum>0.5?0:1)],rx-sz/2,ry-sz/2,sz,sz);
  }
  mctx.globalAlpha=1;

  /* แก่น: ไส้แสง + เกลียววงจักร + สปาร์ค */
  const cg=mctx.createRadialGradient(oc.x,oc.y,0,oc.x,oc.y,orbR*0.95);
  cg.addColorStop(0,`hsla(${hue},96%,92%,${(0.75+V*0.25)*asleep})`);
  cg.addColorStop(0.42,`hsla(${hue},92%,64%,${(0.30+V*0.2)*asleep})`);
  cg.addColorStop(1,'hsla(0,0%,0%,0)');
  mctx.fillStyle=cg; mctx.beginPath(); mctx.arc(oc.x,oc.y,orbR*0.95,0,7); mctx.fill();
  for(const th of THREADS){
    const rr=orbR*th.rr, rot=th.ph+t*2.1*th.sp*spin;
    mctx.save(); mctx.translate(oc.x,oc.y); mctx.rotate(th.tilt+Math.sin(t*0.55+th.ph)*0.3);
    mctx.scale(1,th.sq);
    mctx.strokeStyle=`hsla(${hue},94%,86%,${(0.20+0.26*Math.abs(Math.sin(rot)))*asleep})`;
    mctx.lineWidth=1.1*MDPR;
    mctx.beginPath(); mctx.arc(0,0,rr,rot,rot+th.span); mctx.stroke();
    mctx.restore();
  }
  for(let k=0;k<10;k++){const a=t*(1.3+k*0.22)*spin+k*1.9;
    const sx2=oc.x+Math.cos(a)*orbR*(0.5+0.42*Math.sin(a*0.7));
    const sy2=oc.y+Math.sin(a*1.25)*orbR*(0.46+0.34*Math.cos(a*0.55));
    const ssz=(4+2.4*Math.sin(t*3+k))*MDPR;
    mctx.globalAlpha=0.85*asleep;
    mctx.drawImage(SPR[2],sx2-ssz/2,sy2-ssz/2,ssz,ssz);}
  mctx.globalAlpha=1;

  /* zzz ตอนหลับ */
  if(sleeping){for(let k=0;k<3;k++){const ph2=(t*0.35+k*0.33)%1;
    mctx.globalAlpha=(1-ph2)*0.5; const zs=(3+k)*MDPR;
    mctx.drawImage(SPR[0],(0.70+ph2*0.06)*MW,(0.22-ph2*0.10)*MH,zs,zs);}
    mctx.globalAlpha=1;}

  mctx.globalCompositeOperation='source-over';
}

/* พลังงาน + สี ตามสถานะ (ขับ CSS vars) */
let energy=0.12,target=0.12,t=0; const setTarget=v=>target=v;

/* อนุภาคลอย + โครงข่ายจุดพื้นหลัง */
const hash=i=>{const s=Math.sin(i*127.1+311.7)*43758.5453; return s-Math.floor(s);};
const MOTES=[]; for(let i=0;i<110;i++)MOTES.push({
  x:hash(i*3+1), y:hash(i*7+2), s:0.35+hash(i*11+3)*1.4,
  v:0.00025+hash(i*13+5)*0.00075, ph:hash(i*17+7)*6.28});
const NET=[]; for(let i=0;i<26;i++)NET.push({x:hash(i*5+21),y:hash(i*9+22)});
const NETE=[]; for(let i=0;i<NET.length;i++)for(let j=i+1;j<NET.length;j++){
  const dx=NET[i].x-NET[j].x,dy=NET[i].y-NET[j].y;
  if(dx*dx+dy*dy<0.045)NETE.push([i,j]);}

let lastAlive=Date.now(), sleeping=false;
function markAlive(){lastAlive=Date.now();
  if(sleeping){sleeping=false;document.body.classList.remove('sleeping');poke();}}
function poke(){lastAlive=Date.now();
  const s=document.getElementById('stage');
  s.classList.remove('poked'); void s.offsetWidth; s.classList.add('poked');}
setInterval(()=>{ if(curState==='standby'&&Date.now()-lastAlive>45000&&!sleeping){
  sleeping=true; document.body.classList.add('sleeping'); }},3000);

const stage=document.getElementById('stage');
stage.addEventListener('click',()=>{ poke(); convo?stopConvo():startConvo(); });

function draw(){
  t+=0.0055; energy+=(target-energy)*0.08;
  const e=Math.min(1,energy+0.10+Math.sin(t*2.1)*0.03)*(sleeping?0.35:1);
  const th=curState==='standby'?baseHue+Math.sin(t*0.6)*10:targetHue; curHue=lerpHue(curHue,th,0.05);
  const hue=curHue, root=document.documentElement.style;
  root.setProperty('--hue',hue.toFixed(1));
  root.setProperty('--accent',`hsl(${hue.toFixed(1)} 85% 62%)`);
  root.setProperty('--line',`hsla(${hue.toFixed(1)},60%,60%,.20)`);
  root.setProperty('--e',e.toFixed(3));
  ctx.clearRect(0,0,W,H);
  // โครงข่าย neural จางๆ ไกลๆ
  ctx.strokeStyle=`hsla(${hue},70%,65%,0.05)`; ctx.lineWidth=0.7*DPR;
  for(const [i,j] of NETE){ctx.beginPath();
    ctx.moveTo(NET[i].x*W,NET[i].y*H); ctx.lineTo(NET[j].x*W,NET[j].y*H); ctx.stroke();}
  ctx.fillStyle=`hsla(${hue},80%,75%,0.16)`;
  for(const n of NET){ctx.beginPath();ctx.arc(n.x*W,n.y*H,1.1*DPR,0,7);ctx.fill();}
  // อนุภาคลอยขึ้น (ระยิบ)
  for(const m of MOTES){
    m.y-=m.v; if(m.y<-0.02)m.y=1.02;
    const tw=0.35+0.65*Math.abs(Math.sin(t*1.8+m.ph));
    ctx.fillStyle=`hsla(${hue},85%,80%,${(0.10+0.30*tw)*(sleeping?0.4:1)})`;
    ctx.beginPath();ctx.arc(m.x*W+Math.sin(t+m.ph)*6*DPR, m.y*H, m.s*DPR,0,7);ctx.fill();}
  renderMascot(e,hue);
  requestAnimationFrame(draw);
}
draw();

/* ไมค์ขับลูกแก้ว (best-effort) */
let analyser,micData;
async function initMicMeter(){ if(analyser)return;
  try{const s=await navigator.mediaDevices.getUserMedia({audio:true});const ac=new(window.AudioContext||window.webkitAudioContext)();
    const src=ac.createMediaStreamSource(s);analyser=ac.createAnalyser();analyser.fftSize=256;micData=new Uint8Array(analyser.frequencyBinCount);src.connect(analyser);
    (function m(){if(convo&&!isSpeaking){analyser.getByteTimeDomainData(micData);let s=0;for(let i=0;i<micData.length;i++){const v=(micData[i]-128)/128;s+=v*v;}
      setTarget(0.35+Math.min(0.6,Math.sqrt(s/micData.length)*3.2));}requestAnimationFrame(m);})();
  }catch(e){}
}

/* ---- สมอง ---- */
/* สมองจริง: fetch /ask (proxy ท้องถิ่นถือ API key + คุย Claude). ถ้าไม่มี → สมองเดโม */
function demoBrain(text){
  const q=(text||'').toLowerCase(),has=(...a)=>a.some(w=>q.includes(w));
  if(has('สวัสดี','หวัดดี','สบายดี','ສະບາຍດີ','hello','hi'))return 'สวัสดีครับบู้ — Erwin พร้อมแล้ว';
  if(has('ชื่อ','คือใคร','ເຈົ້າແມ່ນໃຜ','who are you'))return 'ผม Erwin ครับ — ผู้ช่วยส่วนตัวของบู้';
  if(has('ภารกิจ','mission'))return 'ภารกิจเรา: ลด SME failure rate ลาว จาก 80% เหลือ 30% ครับ';
  return 'รับทราบครับบู้ — ตอนนี้ยังเป็นสมองเดโม เปิดผ่าน .command แล้วใส่ API key ผมจะคิดเต็มระบบทันที';
}
/* จำบทสนทนาทั้งชุด → ส่งประวัติไปทุกครั้ง (ต่อเนื่อง เชื่อมเรื่องก่อนหน้าได้) */
const history=[];
async function ask(userContent){
  history.push({role:'user',content:userContent});
  while(history.length>16) history.shift();
  let reply=null;
  try{
    const r=await fetch('/ask',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({messages:history})});
    if(r.ok){const j=await r.json(); if(j.reply) reply=j.reply;}
  }catch(e){}
  if(reply==null){
    const txt=(userContent.find(c=>c.type==='text')||{}).text||'';
    reply = userContent.some(c=>c.type==='image')
      ? 'ผมเห็นภาพแล้วครับบู้ — เปิดผ่าน .command + ใส่ API key ผมจะบอกได้เลยว่านี่คืออะไร'
      : demoBrain(txt);
  }
  // ลบภาพออกจากประวัติหลังใช้ (กันส่งซ้ำเปลืองโทเคน · แต่ยังจำว่าเคยส่งภาพ)
  const u=history[history.length-1];
  if(u && u.role==='user') u.content=u.content.map(c=> c.type==='image' ? {type:'text',text:'[บู้ส่งภาพให้ดู]'} : c);
  history.push({role:'assistant',content:reply});
  return reply;
}

/* ---- ปาก (พูดกลับ) — เสียงไทย โทนผู้บัญชาการ ---- */
let voices=[],erwinVoice=null;
function pickVoice(l){const th=l.filter(v=>v.lang.toLowerCase().startsWith('th'));
  return th.length?(th.find(v=>/pattara|male|ชาย/i.test(v.name))||th.find(v=>/google/i.test(v.name))||th[0]):null;}
function loadVoices(){voices=speechSynthesis.getVoices(); if(!erwinVoice)erwinVoice=pickVoice(voices);}
loadVoices(); if(speechSynthesis.onvoiceschanged!==undefined)speechSynthesis.onvoiceschanged=loadVoices;
// กวาดล้างสัญลักษณ์/markdown/emoji ก่อนพูด → กันเสียงอ่าน "ดอกจัน" ฯลฯ
function speechClean(t){
  return (t||'')
    .replace(/```[\s\S]*?```/g,' ')            // โค้ดบล็อก
    .replace(/`([^`]*)`/g,'$1')                // inline code
    .replace(/!?\[([^\]]+)\]\([^)]*\)/g,'$1')  // ลิงก์ [ข้อความ](url) → ข้อความ
    .replace(/[*_#>~|`]/g,' ')                 // ** _ # > ~ | ` (รวมดอกจัน)
    .replace(/^\s*[-•·–]\s+/gm,'')             // หัวข้อ bullet
    .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2190}-\u{21FF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}]/gu,'') // emoji/สัญลักษณ์
    .replace(/\s+/g,' ')
    .trim();
}
// ตัดข้อความยาวเป็นท่อนสั้น → TTS พูดลื่น ไม่สะดุด/เอ๋อ
function chunkText(t){
  t=(t||'').replace(/\s+/g,' ').trim(); const max=140,out=[]; let i=0;
  while(i<t.length){
    let end=Math.min(i+max,t.length);
    if(end<t.length){ const s=t.slice(i,end);
      const b=Math.max(s.lastIndexOf(' '),s.lastIndexOf('·'),s.lastIndexOf('.'),s.lastIndexOf(','),s.lastIndexOf('ๆ'),s.lastIndexOf('!'),s.lastIndexOf('?'));
      if(b>40) end=i+b+1; }
    out.push(t.slice(i,end).trim()); i=end;
  }
  return out.filter(Boolean);
}
let currentAudio=null;
const _resetState=()=> convo?'listening':(cam&&!cam.hidden?'vision':'standby');
// เสียงในเครื่อง (fallback ถ้าไม่มี Azure)
function browserSpeak(text, done){
  try{
    speechSynthesis.cancel();
    const chunks=chunkText(text); let idx=0;
    const next=()=>{ if(idx>=chunks.length){ done(); return; }
      const u=new SpeechSynthesisUtterance(chunks[idx++]);
      if(erwinVoice){u.voice=erwinVoice;u.lang=erwinVoice.lang;}else u.lang='th-TH';
      u.rate=1.0; u.pitch=1.0; u.onend=next; u.onerror=next;
      u.onboundary=()=>voiceKick(0.75);               // เต้นตามจังหวะพยางค์
      u.onstart=()=>voiceKick(0.6);
      speechSynthesis.speak(u);
    };
    setTimeout(done, Math.max(6000, text.length*120));   // backstop
    next();
  }catch(e){ done(); }
}
// พูด: ลองเสียงคลาวด์ Azure ก่อน → ไม่มี/พลาด → เสียงในเครื่อง
async function speak(text){
  text=speechClean(text);                                 // กันอ่าน "ดอกจัน"
  try{speechSynthesis.cancel();}catch(e){}
  if(currentAudio){ try{currentAudio.pause();}catch(e){} currentAudio=null; }
  isSpeaking=true; try{recog&&recog.stop();}catch(e){}    // หยุดฟังตอนพูด
  if(!text){ isSpeaking=false; busy=false; setState(_resetState()); return; }
  setState('speaking');
  const pulse=setInterval(()=>setTarget(0.5+Math.random()*0.3),140);
  let d=false;
  const done=()=>{ if(d)return; d=true; clearInterval(pulse); isSpeaking=false; busy=false;
    setState(_resetState()); if(convo){ try{recog.start();}catch(e){} } };
  try{
    const r=await fetch('/tts',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text})});
    const ct=r.headers.get('content-type')||'';
    if(r.ok && ct.indexOf('audio')>=0){
      const blob=await r.blob();
      if(blob.size>0){
        const url=URL.createObjectURL(blob); const a=new Audio(url); currentAudio=a;
        hookAudioAnalyser(a);                          // อนุภาคเต้นตามคลื่นเสียงจริง
        a.onended=()=>{ URL.revokeObjectURL(url); if(currentAudio===a)currentAudio=null; done(); };
        a.onerror=()=>{ URL.revokeObjectURL(url); if(currentAudio===a)currentAudio=null; browserSpeak(text,done); };
        setTimeout(done, Math.max(9000, text.length*170));   // backstop
        a.play().catch(()=>browserSpeak(text,done));
        return;
      }
    }
  }catch(e){}
  browserSpeak(text, done);   // fallback
}

/* ---- state ---- */
function setState(st){const s=STATES[st]||STATES.standby;curState=st;baseHue=s.hue;targetHue=s.hue;setTarget(s.e);
  document.body.dataset.state=st; if(st!=='standby')markAlive();}

/* ---- วงจรหลัก ---- */
const field=document.getElementById('field'),micBtn=document.getElementById('mic'),recBtn=document.getElementById('recBtn');
async function handle(text){
  text=(text||'').trim(); if(!text||busy)return; busy=true; markAlive(); setState('thinking');
  const content=[{type:'text',text}];
  const f=currentFrame();                       // ถ้ากล้องเปิดอยู่ → แนบภาพปัจจุบัน (เห็นจริง ไม่เดา)
  if(f) content.unshift({type:'image',source:{type:'base64',media_type:'image/jpeg',data:f}});
  const r=await ask(content); speak(r);
}
function submitField(){const v=field.value;field.value='';handle(v);}
document.getElementById('send').onclick=submitField;
field.addEventListener('keydown',e=>{if(e.key==='Enter')submitField();});

/* ---- หู + โหมดสนทนาต่อเนื่อง (hands-free) — แตะครั้งเดียว แล้วคุยลอยๆ ---- */
let inLang='th-TH', convo=false, isSpeaking=false, busy=false;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition; let recog=null;
if(SR){
  recog=new SR(); recog.continuous=true; recog.interimResults=false; recog.lang=inLang;
  recog.onresult=e=>{ if(busy||isSpeaking) return;
    let txt=''; for(let i=e.resultIndex;i<e.results.length;i++){ if(e.results[i].isFinal) txt+=e.results[i][0].transcript; }
    txt=txt.trim(); if(txt) handle(txt);
  };
  recog.onerror=()=>{};                              // no-speech ฯลฯ → ปล่อยให้ onend รีสตาร์ท
  recog.onend=()=>{ if(convo&&!isSpeaking){ try{recog.start();}catch(e){} } };
}
function startConvo(){ if(!recog) return; convo=true; recog.lang=inLang;
  micBtn.classList.add('on'); setState('listening'); initMicMeter(); try{recog.start();}catch(e){} }
function stopConvo(){ convo=false; micBtn.classList.remove('on'); try{recog.stop();}catch(e){} setState('standby'); }
micBtn.onclick=()=> convo?stopConvo():startConvo();
cv.style.cursor='pointer';
cv.addEventListener('click',()=>{ poke(); convo?stopConvo():startConvo(); });

/* ---- ตา (Vision กล้องสด) ---- */
const cam=document.getElementById('cam'),camVid=document.getElementById('camVid'),camNote=document.getElementById('camNote');
let camStream=null;
// ดึงภาพเฟรมปัจจุบันจากกล้อง (ย่อขนาด กันเปลืองโทเคน) — คืน null ถ้ากล้องปิด
function currentFrame(){
  if(cam.hidden || !camStream || !camVid.videoWidth) return null;
  const w=Math.min(720,camVid.videoWidth), h=Math.round(camVid.videoHeight*(w/camVid.videoWidth));
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d'); g.translate(w,0); g.scale(-1,1); g.drawImage(camVid,0,0,w,h);
  return c.toDataURL('image/jpeg',0.8).split(',')[1];
}
async function openVision(){ cam.hidden=false; camNote.textContent=''; setState('vision');
  try{ camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false}); camVid.srcObject=camStream;
    if(!convo) startConvo();   // เปิดกล้อง = เริ่มฟัง+คุยได้เลย (เห็น+คุยไปพร้อมกัน จนกว่าจะปิดเอง)
  }catch(e){ camNote.textContent='เปิดกล้องไม่ได้ — เปิดผ่าน .command (localhost) + อนุญาตกล้องครับ'; } }
function closeVision(){ cam.hidden=true; if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null;} if(curState==='vision')setState(convo?'listening':'standby'); }
function grabFrame(){ if(!camStream){camNote.textContent='ยังไม่มีภาพจากกล้อง';return;}
  handle('ช่วยดูสิ่งที่กล้องเห็นตอนนี้ให้หน่อยครับ นี่คืออะไร'); }   // ใช้ภาพปัจจุบันผ่าน handle
document.getElementById('camBtn').onclick=()=> cam.hidden?openVision():closeVision();
document.getElementById('camShot').onclick=grabFrame;
document.getElementById('camClose').onclick=closeVision;

/* ---- อัดเสียง ---- */
let mediaRec=null,chunks=[];
async function toggleRec(){
  if(mediaRec&&mediaRec.state==='recording'){mediaRec.stop();return;}
  try{
    const s=await navigator.mediaDevices.getUserMedia({audio:true}); mediaRec=new MediaRecorder(s); chunks=[];
    mediaRec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
    mediaRec.onstop=()=>{ s.getTracks().forEach(t=>t.stop()); recBtn.classList.remove('on');
      speak('อัดเสียงเก็บไว้ให้แล้วครับบู้ — พอต่อระบบถอดเทป ผมจะสรุปประเด็นให้อัตโนมัติ'); };
    mediaRec.start(); recBtn.classList.add('on'); setState('recording');
  }catch(e){}
}
recBtn.onclick=toggleRec;

setState('standby');

/* ---- เช็กว่าต่อ "สมองจริง (API)" แล้ว หรือยังเดโม → บอกที่จุดหน้า ERWIN ---- */
(async()=>{
  const dot=document.querySelector('.wordmark .dot'), wm=document.querySelector('.wordmark');
  try{
    const r=await fetch('/health',{cache:'no-store'});
    if(r.ok){ const h=await r.json();
      if(h.brain){ wm.title='สมองจริง (Claude) เชื่อมแล้ว · เสียง: '+(h.voice||'browser'); return; } }
  }catch(e){}
  dot.style.background='#8a8f98'; dot.style.boxShadow='none';   // เดโม = จุดเทา
  wm.title='โหมดเดโม — เปิดผ่าน .command เพื่อใช้สมองจริง';
})();
</script>
